name: Ultra Controller CI

on:
  push:
    branches:
      - feat/ultra-controller
    paths:
      - '.github/workflows/ultra-controller-ci.yml'
      - '.gitignore'
      - 'Makefile'
      - 'apps/macos/UltraController/**'
      - 'crates/bozo-proto/**'
      - 'fixtures/bmap/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultra-controller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew bundle --file apps/macos/UltraController/Brewfile

      - name: Generate Xcode project
        run: make macos-generate

      - name: Verify project contract
        run: apps/macos/UltraController/Scripts/verify-project.sh

      - name: Commit generated project
        if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/feat/ultra-controller'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/macos/UltraController/UltraController.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m 'chore: generate Ultra Controller Xcode project [skip ci]'
            git push
          fi

      - name: Test existing Rust workspace
        run: cargo test --workspace

      - name: Test HeadphoneCore package
        run: make macos-test-core

      - name: Test macOS application on hosted runner
        run: make macos-test ULTRA_TEST_DEPLOYMENT_TARGET=26.0

      - name: Build production macOS 27 application
        run: make macos-build
