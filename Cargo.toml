[workspace]
resolver = "2"
members = ["crates/bozo-proto", "crates/bozod", "crates/bozo"]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["NerdySouth"]
license = "MIT"
repository = "https://github.com/NerdySouth/bozo"
homepage = "https://github.com/NerdySouth/bozo"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
