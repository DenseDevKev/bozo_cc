[package]
name = "bozod"
version = "0.1.0"
edition = "2021"

[package.metadata.bundle]
name = "bozod"
identifier = "dev.bozo.bozod"
short_description = "Bose QC Ultra headphone daemon"
osx_info_plist_exts = ["InfoPlistExt.plist"]

[dependencies]
bozo-proto = { path = "../bozo-proto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
