[package]
name = "bozod"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Background daemon for Bose QC Ultra headphones over BLE"
readme = "README.md"
keywords = ["bose", "bluetooth", "ble", "headphones", "daemon"]
categories = ["command-line-utilities", "hardware-support"]

[package.metadata.bundle]
name = "bozod"
identifier = "dev.bozo.bozod"
short_description = "Bose QC Ultra headphone daemon"
osx_info_plist_exts = ["InfoPlistExt.plist"]

[dependencies]
bozo-proto = { path = "../bozo-proto", version = "0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
btleplug = "0.11"
uuid = "1"
futures = "0.3"
anyhow = "1.0.102"
